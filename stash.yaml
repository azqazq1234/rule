mode: rule
log-level: info
ipv6: false
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - system
  nameserver:
    - https://zone.rlose.com:39933/api-query
    - https://radar.rlose.com/api-query
  fallback:
    - system
  fallback-filter:
    geoip: false
    ipcidr: []
    domain: []
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "localhost"
    - "captive.apple.com"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "time.*.apple.com"
    - "+.pool.ntp.org"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "*.turn.twilio.com"
    - "*.mcdn.bilivideo.cn"
    - "nas.azqazq1234.xyz"
proxy-providers:
  airport:
    url: https://api.usfoo.com/api/v1/message?token=7d382f8620cae1e2023982a53765c96a
    interval: 43200

proxy-groups:
  - name: FINAL
    type: select
    proxies: [PROXY, HK, JP, DIRECT]
  - name: PROXY
    type: select
    proxies: [HK, JP, SG, TW, MACAO, OTHER]
  - name: JP
    type: url-test
    use: [airport]
    filter: "Japan"
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    tolerance: 100
    lazy: true
  - name: HK
    type: url-test
    use: [airport]
    filter: "Hong Kong"
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    tolerance: 100
    lazy: true
  - name: SG
    type: url-test
    use: [airport]
    filter: "Singapore"
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    tolerance: 100
    lazy: true
  - name: TW
    type: url-test
    use: [airport]
    filter: "Taiwan"
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    tolerance: 100
    lazy: true
  - name: MACAO
    type: url-test
    use: [airport]
    filter: "Macao"
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    tolerance: 100
    lazy: true
  - name: OTHER
    type: url-test
    use: [airport]
    filter: "Malaysia|Thailand|Philippines|Vietnam|Indonesia|Australia|New\\ Zealand|Korea|United\\ States|Canada|Mexico|Brazil|Argentina|Germany|United\\ Kingdom|France|Netherlands|Italia|Ireland|Belgium|Finland|Norway|Sweden|Spain|Hungary|Romania|Russia|Ukraine|South\\ Africa"
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    tolerance: 100
    lazy: true
  - name: AI
    type: select
    proxies: [JP, SG, TW, PROXY]
  - name: Youtube
    type: url-test
    use: [airport]
    filter: Macao
    url: http://cp.cloudflare.com/generate_204
    interval: 900
    tolerance: 100
    lazy: true

rule-providers:
  direct:
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/azqazq1234/rule/refs/heads/main/direct.list
    interval: 86400
  proxy:
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/azqazq1234/rule/refs/heads/main/proxy.list
    interval: 86400
  gpt:
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/azqazq1234/rule/refs/heads/main/gpt.list
    interval: 86400
  youtube:
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/meslcloud/Rule/refs/heads/main/Surge/Youtube.list
    interval: 86400

rules:
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,PROXY
  - RULE-SET,gpt,AI
  - RULE-SET,youtube,Youtube
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,FINAL
